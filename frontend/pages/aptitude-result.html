<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Test Results — AI Placement Coach</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/aptitude.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="ambient-glow"></div>

    <header class="navbar">
        <div class="container nav-container">
            <a href="/pages/dashboard.html" class="brand-logo">
                <div class="brand-icon">🎓</div>
                <span>AI Placement Coach</span>
            </a>
            <div class="nav-actions">
                <a href="/pages/dashboard.html" class="btn btn-outline btn-sm">Dashboard</a>
                <a href="/pages/aptitude.html" class="btn btn-primary btn-sm">Take Another Test</a>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 960px; padding: 40px 20px;">
        <!-- Score Hero -->
        <div class="result-score-hero">
            <span class="badge badge-success" style="font-size: 0.85rem; padding: 6px 14px;">ASSESSMENT COMPLETED</span>
            <div id="res-score-number" class="result-hero-number">0%</div>
            <div style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 24px;">Overall Aptitude Score</div>

            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 600px; margin: 0 auto; text-align: center;">
                <div style="padding: 10px; background: var(--bg-surface); border-radius: var(--radius-md);">
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Accuracy</div>
                    <div id="res-accuracy" style="font-weight: 700; font-size: 1.2rem; color: #fff;">0%</div>
                </div>
                <div style="padding: 10px; background: var(--bg-surface); border-radius: var(--radius-md);">
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Correct</div>
                    <div id="res-correct" style="font-weight: 700; font-size: 1.2rem; color: var(--success);">0</div>
                </div>
                <div style="padding: 10px; background: var(--bg-surface); border-radius: var(--radius-md);">
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Incorrect</div>
                    <div id="res-incorrect" style="font-weight: 700; font-size: 1.2rem; color: var(--danger);">0</div>
                </div>
                <div style="padding: 10px; background: var(--bg-surface); border-radius: var(--radius-md);">
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Time Taken</div>
                    <div id="res-time" style="font-weight: 700; font-size: 1.2rem; color: var(--info);">0s</div>
                </div>
            </div>
        </div>

        <!-- Category Breakdown -->
        <div style="margin-bottom: 32px;">
            <h3 style="font-size: 1.25rem; color: #ffffff; margin-bottom: 16px;">Category Performance</h3>
            <div id="category-breakdown-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;">
                <!-- Populated dynamically -->
            </div>
        </div>

        <!-- Question Reviews -->
        <div>
            <h3 style="font-size: 1.25rem; color: #ffffff; margin-bottom: 16px;">Comprehensive Question Review</h3>
            <div id="questions-review-list">
                <div style="text-align: center; padding: 20px;"><span class="spinner"></span> Loading review...</div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div style="display: flex; justify-content: center; gap: 16px; margin: 40px 0;">
            <a href="/pages/aptitude.html" class="btn btn-primary btn-lg">Practice More Questions ➔</a>
            <a href="/pages/dashboard.html" class="btn btn-secondary btn-lg">Return to Dashboard</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/aptitude-result.js"></script>
</body>
</html>
