<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — AI Placement Coach</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="auth-logo">
                    <div class="brand-icon">🎓</div>
                    <span>AI Placement Coach</span>
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Log in to continue your placement preparation</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">College Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="student@college.edu" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
                    Log In to Dashboard ➔
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account yet? <a href="/pages/register.html">Register free</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
