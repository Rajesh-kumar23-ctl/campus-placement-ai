<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account — AI Placement Coach</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="auth-page">
        <div class="auth-card" style="max-width: 580px;">
            <div class="auth-header">
                <a href="/" class="auth-logo">
                    <div class="brand-icon">🎓</div>
                    <span>AI Placement Coach</span>
                </a>
                <h1 class="auth-title">Create Candidate Profile</h1>
                <p class="auth-subtitle">Configure your profile to personalize assessments and AI interviews</p>
            </div>

            <form id="register-form">
                <div class="auth-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Rajesh Kumar" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="rajesh@college.edu" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password (min 6 characters)</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>

                <div class="auth-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="college">College / University</label>
                        <input type="text" id="college" class="form-control" placeholder="e.g. National Institute of Tech">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="degree">Degree</label>
                        <select id="degree" class="form-control">
                            <option value="B.Tech">B.Tech / B.E</option>
                            <option value="M.Tech">M.Tech / M.E</option>
                            <option value="MCA">MCA</option>
                            <option value="BCA">BCA / B.Sc</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="auth-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="branch">Branch / Specialization</label>
                        <input type="text" id="branch" class="form-control" placeholder="e.g. Computer Science, IT, ECE">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="graduation_year">Graduation Year</label>
                        <select id="graduation_year" class="form-control">
                            <option value="2025">2025</option>
                            <option value="2026" selected>2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="target_role">Target Recruitment Role</label>
                    <select id="target_role" class="form-control">
                        <option value="Software Developer" selected>Software Developer (SDE)</option>
                        <option value="Cloud Engineer">Cloud Engineer (AWS / DevOps)</option>
                        <option value="Frontend Developer">Frontend Developer</option>
                        <option value="Backend Developer">Backend Developer</option>
                        <option value="Data Analyst">Data Analyst</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
                    Complete Registration & Enter Dashboard ➔
                </button>
            </form>

            <div class="auth-footer">
                Already registered? <a href="/pages/login.html">Log In here</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
