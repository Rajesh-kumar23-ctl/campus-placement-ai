[project]
name = "campus-placement-ai"
version = "1.0.0"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "PyJWT>=2.8.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0"
    "psycopg[binary]>=3.2.0",
]

[tool.vercel]
entrypoint = "backend.main:app"